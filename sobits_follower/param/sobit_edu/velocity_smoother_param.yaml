# Configuration example
# Speed limit is about 10% above the physical limit
# Acceleration limit is low enough to avoid sway

/**:
  ros__parameters:
    use_velocity_smoother: true
    namespace: sobits_follower
    raw_cmd_vel_topic: sobits_follower/velocity_smoother/raw_cmd_vel
    output_cmd_vel_topic: /sobit_edu/commands/velocity
    odom_topic: /sobit_edu/odom
    velocity_timeout: 2.5

    # Mandatory parameters
    speed_lim_v: 0.8
    speed_lim_w: 5.0

    accel_lim_v: 0.2 # 0.3 # maximum is actually 2.0, but we push it down to be smooth
    accel_lim_w: 2.0 # 2.0

    # Optional parameters
    frequency: 15.0       # 出力される速度の周波数．入力データの周波数に関わらず，速度スムーサーはこの周波数を維持したままデータを解放する
    decel_factor: 3.5     # 減速/加速度比(大きな慣性モーメントがある場合に増加させることが可能)

    # Robot velocity feedback type:
    #  0 - none
    #  1 - odometry
    #  2 - end robot commands
    robot_feedback: 2
