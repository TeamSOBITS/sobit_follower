# Following Control
/**:
  ros__parameters:
    command_velocity_topic_name : /omni_base_controller/cmd_vel
    following_position_topic_name : /sobits_follower/multiple_sensor_person_tracking/following_position
    obstacles_topic_name : /sobits_follower/multiple_sensor_person_tracking/obstacles
    odom_topic_name : /omni_base_controller/wheel_odom

    base_footprint_name         : base_footprint
    odom_frame_name             : odom
    following_distance          : 1.00

    following_method            : 0                     
      # 0 : VirtualSpringModel-DynamicWindowApproach
      # 1 : VirtualSpringModel
      # 2 : DynamicWindowApproach
      # 3 : PIDController

    # Virtual Spring Model
    following_angle_deg         : 0.0       # theta_sh [deg]
    spring_constant_linear      : 30.0      # k_1 [N/m]
    spring_constant_angular     : 1.0       # k_2 [N・m/rad]
    weight_robot                : 30.0      # M [Kg]
    moment_inertia              : 15.0      # I [Kg・m^2]
    viscous_friction_linear     : 1.00      # k_3 [N・s/m]
    viscous_friction_angular    : 1.00  #1.00      # k_4 [N・s/rad]
    radius_robot                : 0.3       # L [m]
    # display_vsm_path            : true
    display_vsm_target          : false

    # Dynamic Window Approach :Velocity Limit
    min_linear : 0.05
    max_linear : 0.20
    min_angular_deg : -15.0
    max_angular_deg : 15.0
    # Dynamic Window Approach : Step Value
    predict_step : 10
    sampling_time : 0.15     # Predicted time[s] = predict_step[step] * sampling_time[s]
    velocity_step : 7.0
    angle_velocity_step : 30.0
    # Dynamic Window Approach : Weight
    weight_heading : 3.0
    weight_obstacle : 1.0
    weight_velocity : 1.5
    # Dynamic Window Approach : VSM-DWA Weight
    weight_vsm_heading : 3.0
    weight_vsm_obstacle : 2.0 #3.5
    weight_vsm_linear : 2.0
    weight_vsm_angular : 0.5
    # Dynamic Window Approach : Cost Distance
    obstacle_cost_radius : 0.35
    # Dynamic Window Approach : Display Flag
    # display_optimal_path : true
    # display_all_path : true

    # PID Controller
    p_gain : 0.6
    i_gain : 0.4
    d_gain : 0.0
    max_pid_angular_deg : 20.0
