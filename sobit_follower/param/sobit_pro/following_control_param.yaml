# Following Control
/**:
  ros__parameters:
    command_velocity_topic_name : /sobit_pro/cmd_vel
    following_position_topic_name : /sobit_follower/following_position
    obstacles_topic_name : /sobit_follower/obstacles
    odom_topic_name : /sobit_pro/odom
    following_stale_timeout_sec   : 1.20

    base_footprint_name         : sobit_pro/base_footprint
    # following_distance          : 1.10, 1.80
    following_distance          : 0.82 #1.50

    # Virtual Spring Model
    following_angle_deg         : 0.0       # theta_sh [deg]
    spring_constant_linear      : 30.0      # k_1 [N/m]
    spring_constant_angular     : 1.0       # k_2 [N・m/rad]
    weight_robot                : 30.0      # M [Kg]
    moment_inertia              : 15.0      # I [Kg・m^2]
    viscous_friction_linear     : 1.00      # k_3 [N・s/m]
    viscous_friction_angular    : 1.00  #1.00      # k_4 [N・s/rad]
    radius_robot                : 0.3       # L [m]
    # display_vsm_path            : true
    display_vsm_target          : false

    # Dynamic Window Approach :Velocity Limit
    min_linear : 0.05 #0.10
    max_linear : 0.23 #0.50 #0.50
    # max_linear : 0.3
    min_angular_deg : -40.0 #-50.0
    max_angular_deg : 40.0 #50.0
    # Dynamic Window Approach : Step Value
    predict_step : 20 #25
    sampling_time : 0.1 #0.08     # Predicted time[s] = predict_step[step] * sampling_time[s]
    velocity_step : 7.0 #4.0 #7.0
    angle_velocity_step : 30.0 #25.0
    # Dynamic Window Approach : Weight
    # weight_heading : 3.0
    # FIXME
    # weight_heading : 3.0
    weight_heading : 3.2 #1.5  #3.0
    weight_obstacle : 1.4 #2.0 #1.0
    weight_velocity : 1.2 #1.5
    # Dynamic Window Approach : VSM-DWA Weight

    # weight_vsm_obstacle : 2.0 #3.5
    # weight_vsm_obstacle : 2.8
    # FIXME
    # weight_vsm_heading : 3.0
    weight_vsm_heading : 3.0 #1.5
    weight_vsm_obstacle : 1.7 #2.5
    # weight_vsm_linear : 2.0
    # FIXME
    weight_vsm_linear : 2.0 #1.0 #1.5
    weight_vsm_angular : 0.5 #0.2 #0.5
    # Dynamic Window Approach : Cost Distance
    obstacle_cost_radius : 0.45 #0.4
    # Dynamic Window Approach : Display Flag
    # display_optimal_path : true
    # display_all_path : true

    # PID Controller
    # p_gain : 3.6
    p_gain : 0.6 #2.4
    i_gain : 0.4 #0.8
    d_gain : 0.0
    max_pid_angular_deg : 36.0 #50.0
