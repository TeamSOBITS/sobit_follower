# Single Shot Multibox Detector
/**:
  ros__parameters:
    image_topic_name : /sobit_edu/head_camera/rgb/image_raw
    cloud_topic_name : /sobit_edu/head_camera/depth_registered/points
    depth_image_topic_name : /sobit_edu/head_camera/depth/image_raw
    base_frame_name : sobit_edu/base_footprint
    info_topic_name : /sobit_edu/head_camera/rgb/camera_info

    image_show: false
    weight_file: yolo26n.pt # yolo weight file
    # weight_file: yolo11n.pt

    image_show_flag : false
    execute_default : true
    ssd_pub_result_image : true
    rqt_image_view_flag : false
    use_tf : false

    in_scale_factor : 0.007843
    confidence_threshold : 0.7

    object_specified_enabled : true
    specified_object_name : person

    # image_to_position
    use_3d : true
    bbox_topic_name : /object_boxes # /ssd_ros/objects_rect or /object_boxes
    cluster_tolerance : 0.01
    min_clusterSize : 200
    max_clusterSize : 20000
    noise_point_cloud_range : 0.1
    enable_id: false
    positioning_detection_mode : 'fast_point' # point_cloud, depth_image, fast_point
